name: Publish catalog

on:
  workflow_call:
    inputs:
      environment:
        description: GitHub environment that owns the deployment credentials.
        required: true
        type: string
      revision:
        description: Positive catalog revision to publish.
        required: true
        type: string
      staging_revision:
        description: Immutable staging catalog revision to promote.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: publish-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  check:
    name: Validate publication input
    runs-on: ubuntu-latest
    steps:
      - name: Require the protected main branch
        shell: bash
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "Publication runs are allowed only from refs/heads/main; received $GITHUB_REF." >&2
            exit 1
          fi

      - name: Check out the requested revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up pnpm
        uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1 # v4.2.0
        with:
          version: 11.18.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4.5.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install checked dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Validate catalog metadata
        run: pnpm validate

      - name: Run publisher tests
        run: pnpm test

  publish:
    name: Publish ${{ inputs.environment }} catalog
    needs: check
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Check out the requested revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up pnpm
        uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1 # v4.2.0
        with:
          version: 11.18.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4.5.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install checked dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Prepare the verified publication bundle
        env:
          PUBLISH_TARGET: ${{ inputs.environment }}
          PUBLISH_REVISION: ${{ inputs.revision }}
          PUBLISH_STAGING_REVISION: ${{ inputs.staging_revision }}
          BOT_PUBLIC_BASE_URL: ${{ vars.BOT_PUBLIC_BASE_URL }}
          STAGING_PUBLIC_BASE_URL: ${{ vars.STAGING_PUBLIC_BASE_URL }}
          STAGING_CATALOG_KEY_ID: ${{ vars.STAGING_CATALOG_KEY_ID }}
          STAGING_CATALOG_PUBLIC_KEY: ${{ vars.STAGING_CATALOG_PUBLIC_KEY }}
        shell: bash
        run: |
          if [ "$PUBLISH_TARGET" = production ]; then
            node tools/publish.mjs prepare production --revision "$PUBLISH_REVISION" --staging-revision "$PUBLISH_STAGING_REVISION"
            exit 0
          fi
          node tools/publish.mjs prepare staging --revision "$PUBLISH_REVISION"
      - name: Publish the signed catalog
        env:
          PUBLISH_TARGET: ${{ inputs.environment }}
          PUBLISH_REVISION: ${{ inputs.revision }}
          PUBLISH_STAGING_REVISION: ${{ inputs.staging_revision }}
          SPACES_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_KEY_ID }}
          SPACES_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_ACCESS_KEY }}
          CATALOG_SIGNING_PRIVATE_KEY: ${{ secrets.CATALOG_SIGNING_PRIVATE_KEY }}
          SPACES_BUCKET: ${{ vars.SPACES_BUCKET }}
          SPACES_ENDPOINT: ${{ vars.SPACES_ENDPOINT }}
          SPACES_REGION: ${{ vars.SPACES_REGION }}
          BOT_PUBLIC_BASE_URL: ${{ vars.BOT_PUBLIC_BASE_URL }}
          CATALOG_KEY_ID: ${{ vars.CATALOG_KEY_ID }}
          CATALOG_PUBLIC_KEY: ${{ vars.CATALOG_PUBLIC_KEY }}
          STAGING_PUBLIC_BASE_URL: ${{ vars.STAGING_PUBLIC_BASE_URL }}
          STAGING_CATALOG_KEY_ID: ${{ vars.STAGING_CATALOG_KEY_ID }}
          STAGING_CATALOG_PUBLIC_KEY: ${{ vars.STAGING_CATALOG_PUBLIC_KEY }}
          PUBLISH_PREFIX: public/robotics-facility
        shell: bash
        run: |
          if [ "$PUBLISH_TARGET" = production ]; then
            exec node tools/publish.mjs production --revision "$PUBLISH_REVISION" --staging-revision "$PUBLISH_STAGING_REVISION"
          fi
          exec node tools/publish.mjs staging --revision "$PUBLISH_REVISION"
