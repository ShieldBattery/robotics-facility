name: Validate

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - name: Check out the requested revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up pnpm
        uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1 # v4.2.0
        with:
          version: 11.18.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4.5.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install checked dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Validate catalog metadata
        run: pnpm validate

      - name: Run tests
        run: pnpm test
